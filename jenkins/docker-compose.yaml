version: "3.9"

services:

  terraform:

    image: hashicorp/terraform:1.8.5

    container_name: terraform

    working_dir: /workspace

    volumes:

      - ../:/workspace

      - ~/.aws:/root/.aws:ro

    environment:

      AWS_PROFILE: "${TF_VAR_AWS_PROFILE}"

      AWS_REGION: "${AWS_REGION}"

    tty: true

  kubectl:

    image: bitnami/kubectl:1.30

    container_name: kubectl

    volumes:

      - ../:/workspace

      - ~/.aws:/root/.aws:ro

    environment:

      AWS_PROFILE: "${TF_VAR_AWS_PROFILE}"

      AWS_REGION: "${AWS_REGION}"

    tty: true
    
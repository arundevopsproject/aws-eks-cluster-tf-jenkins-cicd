apiVersion: kyverno.io/v1

kind: ClusterPolicy

metadata:

  name: restrict-latest-tag

spec:

  validationFailureAction: enforce

  rules:

    - name: no-latest-tag

      match:

        resources:

          kinds:

            - Pod

      validate:

        message: "latest image tag is not allowed"

        pattern:

          spec:

            containers:

              - image: "!*:latest"
              
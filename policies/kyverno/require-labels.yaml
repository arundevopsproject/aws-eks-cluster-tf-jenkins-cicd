apiVersion: kyverno.io/v1

kind: ClusterPolicy

metadata:

  name: require-labels

spec:

  validationFailureAction: enforce

  rules:

    - name: check-labels

      match:

        resources:

          kinds:

            - Pod

      validate:

        message: "Labels are required"

        pattern:

          metadata:

            labels:

              app: "?*"
              